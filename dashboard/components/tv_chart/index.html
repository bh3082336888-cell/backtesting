<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade chart</title>
  <style>
    :root { --bg: #ffffff; --ink: #1f1f1d; --muted: #898781; --grid: #e1e0d9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); overflow: hidden;
                 font: 12px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 560px; }
    #bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 30px; padding: 4px 6px; }
    #title { font-size: 14px; font-weight: 600; }
    #ohlc { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #ohlc b { color: var(--ink); font-weight: 500; }
    #key { display: flex; gap: 10px; margin-left: auto; color: var(--muted); }
    #key span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                        margin-right: 4px; background: var(--c); vertical-align: 0; }
    label.toggle { color: var(--muted); cursor: pointer; user-select: none; }
    button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--grid);
             border-radius: 4px; padding: 2px 10px; cursor: pointer; }
    button:hover { border-color: var(--muted); }
    #chart { position: relative; flex: 1; min-height: 0; }
    #tip { position: fixed; z-index: 10; max-width: 380px; padding: 6px 8px; pointer-events: none;
           background: var(--bg); color: var(--ink); border: 1px solid var(--muted); border-radius: 4px;
           box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); line-height: 1.4; white-space: nowrap; }
    #tip div:first-child { font-weight: 600; }
    #tip[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="bar">
    <span id="title"></span>
    <span id="ohlc"></span>
    <span id="key"></span>
    <label class="toggle" title="the signal bar's close, joined to the fill"><input type="checkbox" id="signal"
      checked> signal bar</label>
    <button id="fit" type="button" title="see the whole range and fit the price axis (or double-click the chart)">fit</button>
  </div>
  <div id="chart"></div>
  <div id="tip" hidden></div>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
