[project]
name = "perp-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "pyyaml>=6", "requests>=2.31",
  "ccxt>=4.3", "typer>=0.12", "tabulate>=0.9",
  # ccxt <= 4.5.88's websocket drain miscounts the per-message queue overhead aiohttp added in
  # 3.14.4, so busy streams stall for good
  # (tests/test_paper.py::test_ccxt_ws_drain_keeps_aiohttp_queue_accounting_balanced).
  # Fixed upstream in ccxt PR #30877 (merged 2026-10-14, unreleased as of 2026-10-16): drop this pin
  # once a ccxt release after 4.5.88 is out and the test passes on the latest aiohttp.
  "aiohttp<3.14.4",
  "sqlalchemy>=2.0", "streamlit>=1.40", "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lab = "perp_lab.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["perp_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
