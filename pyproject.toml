[project]
name = "perp-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "pyyaml>=6", "requests>=2.31",
  "ccxt>=4.3", "typer>=0.12", "tabulate>=0.9",
  "sqlalchemy>=2.0", "streamlit>=1.40", "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lab = "perp_lab.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["perp_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
